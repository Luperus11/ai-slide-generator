<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Lecture Video Generator</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #0F172A; color: #F8FAFC; padding: 40px; display: flex; justify-content: center; }
        .card { background: #1E293B; padding: 30px; border-radius: 12px; width: 700px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #EA580C; margin-bottom: 20px; font-size: 24px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #94A3B8; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #334155; background: #0F172A; color: #FFF; box-sizing: border-box; font-size: 15px; }
        .divider { text-align: center; margin: 15px 0; color: #64748B; font-weight: bold; }
        button { margin-top: 25px; width: 100%; padding: 14px; background: #EA580C; border: none; color: white; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #C2410C; }
        #status { margin-top: 15px; color: #38BDF8; font-weight: bold; text-align: center; }
        video { width: 100%; margin-top: 20px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🎬 AI สร้างวิดีโอสอนอัตโนมัติ (จากหัวข้อหรือไฟล์เอกสาร)</h1>
    
    <form id="videoForm" enctype="multipart/form-data">
        <label>1. หัวข้อวิชา / เรื่องที่จะสอน:</label>
        <input type="text" name="topic" id="topic" placeholder="เช่น การแปลงลาปลาซ หรือปล่อยว่างถ้าแนบไฟล์...">

        <div class="divider">--- หรือ ---</div>

        <label>2. แนบไฟล์เนื้อหาเอกสาร (.pdf, .docx, .txt):</label>
        <input type="file" name="file" id="file" accept=".pdf,.docx,.txt">

        <button type="submit" id="submitBtn">🚀 เริ่มสร้างวิดีโอสอนเลย</button>
    </form>

    <div id="status"></div>
    <video id="videoPlayer" controls></video>
</div>

<script>
document.getElementById('videoForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const status = document.getElementById('status');
    const videoPlayer = document.getElementById('videoPlayer');
    const submitBtn = document.getElementById('submitBtn');

    const topic = document.getElementById('topic').value.trim();
    const file = document.getElementById('file').files[0];

    if (!topic && !file) {
        alert("กรุณากรอกหัวข้อ หรือเลือกไฟล์แนบอย่างใดอย่างหนึ่งด้วยครับ");
        return;
    }

    status.innerText = "⏳ กำลังอ่านเนื้อหา สรุปเป็นสไลด์ พากย์เสียงภาษาไทย และเรนเดอร์วิดีโอ... (โปรดรอสักครู่)";
    videoPlayer.style.display = "none";
    submitBtn.disabled = true;

    const formData = new FormData(this);

    try {
        const response = await fetch('/generate_video', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();

        if (result.success) {
            status.innerText = "✅ สร้างวิดีโอสำเร็จเรียบร้อย!";
            videoPlayer.src = result.video_url + '?t=' + new Date().getTime();
            videoPlayer.style.display = "block";
            videoPlayer.play();
        } else {
            status.innerText = "❌ เกิดข้อผิดพลาด: " + (result.error || "ในการสร้างวิดีโอ");
        }
    } catch (err) {
        status.innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: " + err.message;
        console.error(err);
    } finally {
        submitBtn.disabled = false;
    }
});
</script>

</body>
</html>
